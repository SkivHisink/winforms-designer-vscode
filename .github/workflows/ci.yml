name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # WinForms is Windows-only, so the engine and e2e must run on Windows.
    runs-on: windows-latest
    env:
      WFD_EVIDENCE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build engine (Release)
        run: dotnet build engine -c Release

      - name: Build .NET Framework engine (Release, x64)
        run: dotnet build engine-net48 -c Release -p:PlatformTarget=x64

      - name: Unit tests (engine)
        run: dotnet test tests/Engine.UnitTests -c Release --logger "trx;LogFileName=modern.trx" --results-directory "$env:RUNNER_TEMP\v2-scenario-evidence\test-results\modern"

      # net48 unit floor (ADR 0001): runs the shared IR core (front-end / validator / executor) on the ACTUAL
      # .NET Framework 4.8 runtime with real net48 WinForms controls — where the interpreter runs in production.
      - name: Unit tests (engine, net48)
        run: dotnet test tests/Engine.Net48.UnitTests -c Release --logger "trx;LogFileName=net48.trx" --results-directory "$env:RUNNER_TEMP\v2-scenario-evidence\test-results\net48"

      - name: Compare product renders with archived Visual Studio references
        shell: pwsh
        env:
          WFD_VISUAL_REFERENCE_EVIDENCE_FILE: ${{ runner.temp }}\v2-scenario-evidence\visual-reference.json
        run: ./scripts/compare-visual-studio-reference-renders.ps1

      # M6 fallback-rate gate (ADR 0002 §Release GO checklist): measure the source-coverage interpreted-vs-fallback
      # rate over the sample corpus and FAIL below the floor, so a regression that drops a construct out of the closed
      # IR (raising the fallback rate) blocks the pipeline with the rate visible in the log. The same CLI runs against a
      # real (e.g. DevExpress) corpus — `--coverage-report <dir> --min-rate <pct>` — for the maintainer's release gate.
      - name: M6 coverage gate (engine samples)
        run: dotnet run --project engine -c Release --coverage-report engine/samples --min-rate 80

      # Build the sample fixtures the e2e relies on. Their bin/ output is gitignored,
      # so without this step e2e silently skips the custom-control and multi-target
      # resolver checks on a clean checkout.
      - name: Build sample fixtures
        run: |
          dotnet build samples/CustomControls -c Release
          dotnet build samples/ComplexProject -f net8.0-windows -c Debug -p:TargetFrameworks=net8.0-windows
          dotnet build samples/ComplexProject -f net9.0-windows -c Debug -p:TargetFrameworks=net9.0-windows
          dotnet build samples/ComplexProject -f net10.0-windows -c Debug -p:TargetFrameworks=net10.0-windows
          dotnet build fixtures/Net48CtxFixture -c Release -p:PlatformTarget=x64
          dotnet build fixtures/FakeVendor -c Release -p:PlatformTarget=x64

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Audit extension dependencies
        working-directory: extension
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm audit --audit-level=moderate
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt 3) { Start-Sleep -Seconds (10 * $i) }
          }
          exit 1

      - name: Validate v2 scenario catalog and archived traces
        shell: pwsh
        run: ./scripts/validate-v2-scenario-catalog.ps1 -StaticOnly

      - name: Validate generated v2 protocol contract
        run: node ./scripts/generate-v2-protocol.mjs --check

      - name: Release metadata preflight
        working-directory: extension
        run: npm run release:preflight

      - name: VSIX packaging isolation tests
        shell: pwsh
        run: ./scripts/test-vsix-isolation.ps1

      - name: Typecheck
        working-directory: extension
        run: npm run typecheck

      - name: Unit tests (extension)
        working-directory: extension
        run: npm test -- --reporter=json --outputFile="$env:RUNNER_TEMP\v2-scenario-evidence\test-results\vitest.json"

      - name: Build xUnit and Vitest scenario evidence
        shell: pwsh
        run: |
          node ./scripts/collect-v2-test-evidence.mjs --kind=xunit "--input=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/test-results/modern/modern.trx')" "--output=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/xunit-modern.json')" --invocation=xunit-modern-net10
          node ./scripts/collect-v2-test-evidence.mjs --kind=xunit "--input=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/test-results/net48/net48.trx')" "--output=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/xunit-net48.json')" --invocation=xunit-net48
          node ./scripts/collect-v2-test-evidence.mjs --kind=vitest "--input=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/test-results/vitest.json')" "--output=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/vitest.json')" --invocation=vitest-4.1.11

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Performance baseline
        working-directory: extension
        run: npm run perf:baseline

      - name: Syntax-check webview scripts
        working-directory: extension
        run: |
          node --check media/designer.js
          node --check media/panel.js
          node --check media/chooseItems.js

      # Text-integrity gate: a file that round-tripped through CP1251/Latin-1 still parses, so `node --check` and the
      # class-selecting webview tests stay green while the UI renders garbage where a typographic glyph belongs
      # (v1.2.0 shipped seven such literals into the data-binding property grid).
      - name: Mojibake scan
        working-directory: extension
        run: npm run mojibake:scan

      - name: Localization parity
        working-directory: extension
        run: npm run l10n:parity -- --strict

      - name: End-to-end (headless)
        working-directory: extension
        env:
          WFD_REQUIRE_NET48: "1"
        run: npm run e2e

      - name: Live-webview tests (headless jsdom)
        working-directory: extension
        env:
          WFD_SCENARIO_EVIDENCE_FILE: ${{ runner.temp }}\v2-scenario-evidence\webview.json
        run: npm run webview-e2e

      - name: VS Code 1.84 Extension Host smoke
        working-directory: extension
        env:
          WFD_SCENARIO_EVIDENCE_DIR: ${{ runner.temp }}\v2-scenario-evidence
        run: npm run extension-host-e2e -- --version=1.84.0

      - name: VS Code Stable Extension Host smoke
        working-directory: extension
        env:
          WFD_SCENARIO_EVIDENCE_DIR: ${{ runner.temp }}\v2-scenario-evidence
        run: npm run extension-host-e2e -- --version=stable

      - name: Validate measured v2 scenario evidence
        shell: pwsh
        run: ./scripts/validate-v2-scenario-catalog.ps1 -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence')

      - name: Prove all v2 evidence adversarial controls fail closed
        shell: pwsh
        run: node ./scripts/test-v2-execution-evidence-gate.mjs "--evidence-dir=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence')"

      - name: Upload measured v2 scenario evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-scenario-evidence
          path: ${{ runner.temp }}/v2-scenario-evidence
          if-no-files-found: error

      - name: Package VSIX (Windows x64)
        # `vsce package` runs the `vscode:prepublish` script, which builds, bundles the engine
        # into extension/engine/, and copies the LICENSE — so the artifact is self-contained.
        working-directory: extension
        env:
          WFD_BUNDLE_RID: win-x64
        run: npx --yes @vscode/vsce@3.9.2 package --target win32-x64 --no-dependencies -o winforms-designer-win32-x64.vsix

      - name: Assert VSIX contains the bundled engines (Windows x64)
        working-directory: extension
        shell: pwsh
        run: ../scripts/assert-vsix.ps1 -VsixPath winforms-designer-win32-x64.vsix -ExpectedTarget win32-x64 -ExpectedRuntimeIdentifier win-x64 -ExpectedModernMachine 0x8664 -ExpectedNet48Machine 0x8664

      - name: Freeze verified VSIX (Windows x64)
        working-directory: extension
        shell: pwsh
        run: Copy-Item -LiteralPath winforms-designer-win32-x64.vsix -Destination (Join-Path $env:RUNNER_TEMP 'frozen-win32-x64.vsix') -Force

      - name: Package VSIX (Windows ARM64)
        working-directory: extension
        shell: pwsh
        env:
          WFD_BUNDLE_RID: win-arm64
        run: npx --yes @vscode/vsce@3.9.2 package --target win32-arm64 --no-dependencies -o winforms-designer-win32-arm64.vsix

      - name: Assert VSIX contains the bundled engines (Windows ARM64)
        working-directory: extension
        shell: pwsh
        run: ../scripts/assert-vsix.ps1 -VsixPath winforms-designer-win32-arm64.vsix -ExpectedTarget win32-arm64 -ExpectedRuntimeIdentifier win-arm64 -ExpectedModernMachine 0xAA64 -ExpectedNet48Machine 0x8664

      - name: Freeze and re-verify both VSIX artifacts
        working-directory: extension
        shell: pwsh
        run: |
          Copy-Item -LiteralPath winforms-designer-win32-arm64.vsix -Destination (Join-Path $env:RUNNER_TEMP 'frozen-win32-arm64.vsix') -Force
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'frozen-win32-x64.vsix') -Destination winforms-designer-win32-x64.vsix -Force
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'frozen-win32-arm64.vsix') -Destination winforms-designer-win32-arm64.vsix -Force
          ../scripts/assert-vsix.ps1 -VsixPath winforms-designer-win32-x64.vsix -ExpectedTarget win32-x64 -ExpectedRuntimeIdentifier win-x64 -ExpectedModernMachine 0x8664 -ExpectedNet48Machine 0x8664
          ../scripts/assert-vsix.ps1 -VsixPath winforms-designer-win32-arm64.vsix -ExpectedTarget win32-arm64 -ExpectedRuntimeIdentifier win-arm64 -ExpectedModernMachine 0xAA64 -ExpectedNet48Machine 0x8664

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: winforms-designer-vsix
          path: |
            extension/winforms-designer-win32-x64.vsix
            extension/winforms-designer-win32-arm64.vsix
          if-no-files-found: error
