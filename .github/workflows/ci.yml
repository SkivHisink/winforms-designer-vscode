name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # WinForms is Windows-only, so the engine and e2e must run on Windows.
    runs-on: windows-latest
    env:
      WFD_EVIDENCE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The installed upgrade/downgrade acceptance reconstructs the 2.1.0 baseline with `git archive`.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build engine (Release)
        run: dotnet build engine -c Release

      - name: Build .NET Framework engine (Release, x64)
        run: dotnet build engine-net48 -c Release -p:PlatformTarget=x64

      - name: Unit tests (engine)
        run: dotnet test tests/Engine.UnitTests -c Release --logger "trx;LogFileName=modern.trx" --results-directory "$env:RUNNER_TEMP\v2-scenario-evidence\test-results\modern"

      # net48 unit floor (ADR 0001): runs the shared IR core (front-end / validator / executor) on the ACTUAL
      # .NET Framework 4.8 runtime with real net48 WinForms controls — where the interpreter runs in production.
      - name: Unit tests (engine, net48)
        run: dotnet test tests/Engine.Net48.UnitTests -c Release --logger "trx;LogFileName=net48.trx" --results-directory "$env:RUNNER_TEMP\v2-scenario-evidence\test-results\net48"

      - name: Compare product renders with archived Visual Studio references
        shell: pwsh
        env:
          WFD_VISUAL_REFERENCE_EVIDENCE_FILE: ${{ runner.temp }}\v2-scenario-evidence\visual-reference.json
        run: ./scripts/compare-visual-studio-reference-renders.ps1

      # M6 fallback-rate gate (ADR 0002 §Release GO checklist): measure the source-coverage interpreted-vs-fallback
      # rate over the sample corpus and FAIL below the floor, so a regression that drops a construct out of the closed
      # IR (raising the fallback rate) blocks the pipeline with the rate visible in the log. The same CLI runs against a
      # real (e.g. DevExpress) corpus — `--coverage-report <dir> --min-rate <pct>` — for the maintainer's release gate.
      - name: M6 coverage gate (engine samples)
        run: dotnet run --project engine -c Release --coverage-report engine/samples --min-rate 80

      # Build the sample fixtures the e2e relies on. Their bin/ output is gitignored,
      # so without this step e2e silently skips the custom-control and multi-target
      # resolver checks on a clean checkout.
      - name: Build sample fixtures
        run: |
          dotnet build samples/CustomControls -c Release
          dotnet build samples/ComplexProject -f net8.0-windows -c Debug -p:TargetFrameworks=net8.0-windows
          dotnet build samples/ComplexProject -f net9.0-windows -c Debug -p:TargetFrameworks=net9.0-windows
          dotnet build samples/ComplexProject -f net10.0-windows -c Debug -p:TargetFrameworks=net10.0-windows
          dotnet build fixtures/Net48CtxFixture -c Release -p:PlatformTarget=x64
          dotnet build fixtures/FakeVendor -c Release -p:PlatformTarget=x64

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Audit extension dependencies
        working-directory: extension
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm audit --audit-level=moderate
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt 3) { Start-Sleep -Seconds (10 * $i) }
          }
          exit 1

      - name: Adapter SDK independent contract tests
        run: node --test adapter-sdk/test/*.test.mjs

      - name: Adapter SDK public type contract
        run: node extension/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext adapter-sdk/test/type-contract.mts

      - name: Build independent Adapter SDK samples
        run: node samples/AdapterSdkPreview/build.mjs

      - name: Pack independent Adapter SDK artifact
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'release24-sdk-package'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $pack = npm pack ./adapter-sdk --pack-destination $destination --json
          if ($LASTEXITCODE -ne 0) { throw 'Adapter SDK npm pack failed.' }
          $package = @(($pack -join [Environment]::NewLine) | ConvertFrom-Json)
          $expected = @('LICENSE', 'README.md', 'adapter-package.schema.json', 'index.d.mts', 'index.mjs', 'package.json') | Sort-Object
          $actual = @($package[0].files | ForEach-Object { $_.path } | Sort-Object)
          if ($package.Count -ne 1 -or $package[0].name -ne '@winforms-designer/adapter-sdk' -or $package[0].version -ne '0.1.0' -or (Compare-Object $expected $actual)) {
            throw 'Adapter SDK package identity or independent six-file payload does not match the public contract.'
          }
          $archive = Join-Path $destination $package[0].filename
          $package[0] | Add-Member -NotePropertyName sha256 -NotePropertyValue (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $package | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $destination 'pack.json') -Encoding utf8
          $pack | Write-Output

      - name: Upload independent Adapter SDK artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release24-sdk-package
          path: ${{ runner.temp }}/release24-sdk-package
          if-no-files-found: error

      - name: Independent Designer SDK ABI probe
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP ('release24-abi-' + [Guid]::NewGuid().ToString('N'))
          try {
            ./samples/DesignerSdkAbiProbe/run-probe.ps1 -OutputDirectory $probe
            if ($LASTEXITCODE -ne 0) { throw 'Independent Designer SDK ABI probe failed.' }
            if (@(Get-ChildItem -LiteralPath $probe -File -Filter '*.log').Count -ne 6 -or @(Get-ChildItem -LiteralPath $probe -File -Filter '*.json').Count -ne 3) {
              throw 'Independent Designer SDK ABI probe must produce six command logs and three JSON reports.'
            }
          } finally {
            if (Test-Path -LiteralPath $probe) {
              $destination = Join-Path $env:RUNNER_TEMP 'release24-abi-evidence'
              New-Item -ItemType Directory -Force -Path $destination | Out-Null
              Get-ChildItem -LiteralPath $probe -File | Where-Object { $_.Extension -in @('.log', '.json') } | Copy-Item -Destination $destination -Force
            }
          }

      - name: Upload independent Designer SDK ABI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release24-abi-evidence
          path: ${{ runner.temp }}/release24-abi-evidence
          if-no-files-found: error

      - name: Validate v2 scenario catalog and archived traces
        shell: pwsh
        run: ./scripts/validate-v2-scenario-catalog.ps1 -StaticOnly

      - name: Validate generated v2 protocol contract
        run: node ./scripts/generate-v2-protocol.mjs --check

      - name: Release metadata preflight
        working-directory: extension
        run: npm run release:preflight

      - name: VSIX packaging isolation tests
        shell: pwsh
        run: ./scripts/test-vsix-isolation.ps1

      - name: Typecheck
        working-directory: extension
        run: npm run typecheck

      - name: Unit tests (extension)
        working-directory: extension
        run: npm test -- --reporter=json --outputFile="$env:RUNNER_TEMP\v2-scenario-evidence\test-results\vitest.json"

      - name: Build xUnit and Vitest scenario evidence
        shell: pwsh
        run: |
          node ./scripts/collect-v2-test-evidence.mjs --kind=xunit "--input=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/test-results/modern/modern.trx')" "--output=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/xunit-modern.json')" --invocation=xunit-modern-net10
          node ./scripts/collect-v2-test-evidence.mjs --kind=xunit "--input=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/test-results/net48/net48.trx')" "--output=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/xunit-net48.json')" --invocation=xunit-net48
          node ./scripts/collect-v2-test-evidence.mjs --kind=vitest "--input=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/test-results/vitest.json')" "--output=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence/vitest.json')" --invocation=vitest-4.1.12

      - name: Build extension
        id: build-extension
        working-directory: extension
        run: npm run build

      - name: Performance baseline
        working-directory: extension
        run: npm run perf:baseline

      - name: Syntax-check webview scripts
        working-directory: extension
        run: |
          node --check media/designer.js
          node --check media/panel.js
          node --check media/chooseItems.js

      # Text-integrity gate: a file that round-tripped through CP1251/Latin-1 still parses, so `node --check` and the
      # class-selecting webview tests stay green while the UI renders garbage where a typographic glyph belongs
      # (v1.2.0 shipped seven such literals into the data-binding property grid).
      - name: Mojibake scan
        working-directory: extension
        run: npm run mojibake:scan

      - name: Localization parity
        working-directory: extension
        run: npm run l10n:parity -- --strict

      - name: End-to-end (headless)
        working-directory: extension
        env:
          WFD_REQUIRE_NET48: "1"
        run: npm run e2e

      - name: Live-webview tests (headless jsdom)
        working-directory: extension
        env:
          WFD_SCENARIO_EVIDENCE_FILE: ${{ runner.temp }}\v2-scenario-evidence\webview.json
        run: npm run webview-e2e

      # The Extension Host suites are independent of each other. Each one runs whenever the extension built, so a
      # failure in one does not hide the results of the rest; any failure still fails the job.
      - name: VS Code 1.84 Extension Host smoke
        if: ${{ !cancelled() && steps.build-extension.outcome == 'success' }}
        working-directory: extension
        env:
          WFD_SCENARIO_EVIDENCE_DIR: ${{ runner.temp }}\v2-scenario-evidence
        run: npm run extension-host-e2e -- --version=1.84.0

      - name: VS Code Stable Extension Host smoke
        if: ${{ !cancelled() && steps.build-extension.outcome == 'success' }}
        working-directory: extension
        env:
          WFD_SCENARIO_EVIDENCE_DIR: ${{ runner.temp }}\v2-scenario-evidence
        run: npm run extension-host-e2e -- --version=stable

      - name: Release 2.2 ordinary product acceptance (VS Code 1.84)
        if: ${{ !cancelled() && steps.build-extension.outcome == 'success' }}
        working-directory: extension
        env:
          WFD_RELEASE22_EVIDENCE_FILE: ${{ runner.temp }}\release22-product-evidence\release22-host-1.84.0.json
        run: npm run release22:extension-host -- --version=1.84.0

      - name: Release 2.2 ordinary product acceptance (VS Code Stable)
        if: ${{ !cancelled() && steps.build-extension.outcome == 'success' }}
        working-directory: extension
        env:
          WFD_RELEASE22_EVIDENCE_FILE: ${{ runner.temp }}\release22-product-evidence\release22-host-stable.json
        run: npm run release22:extension-host -- --version=stable

      - name: Upload Release 2.2 ordinary product acceptance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release22-product-evidence
          path: ${{ runner.temp }}/release22-product-evidence
          if-no-files-found: warn

      - name: Release 2.3 history and hot exit (VS Code 1.84)
        if: ${{ !cancelled() && steps.build-extension.outcome == 'success' }}
        working-directory: extension
        env:
          WFD_RELEASE23_EVIDENCE_FILE: ${{ runner.temp }}\release23-product-evidence\release23-host-1.84.0.json
        run: npm run release23:extension-host -- --version=1.84.0

      - name: Release 2.3 history and hot exit (VS Code Stable)
        if: ${{ !cancelled() && steps.build-extension.outcome == 'success' }}
        working-directory: extension
        env:
          WFD_RELEASE23_EVIDENCE_FILE: ${{ runner.temp }}\release23-product-evidence\release23-host-stable.json
        run: npm run release23:extension-host -- --version=stable

      - name: Upload Release 2.3 history and hot exit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release23-product-evidence
          path: ${{ runner.temp }}/release23-product-evidence
          if-no-files-found: warn

      - name: Release 2.3 Adapter SDK Preview (R24) (VS Code 1.84)
        if: ${{ !cancelled() && steps.build-extension.outcome == 'success' }}
        working-directory: extension
        env:
          WFD_RELEASE24_EVIDENCE_FILE: ${{ runner.temp }}\release24-product-evidence\release24-host-1.84.0.json
        run: npm run release24:extension-host -- --version=1.84.0

      - name: Release 2.3 Adapter SDK Preview (R24) (VS Code Stable)
        if: ${{ !cancelled() && steps.build-extension.outcome == 'success' }}
        working-directory: extension
        env:
          WFD_RELEASE24_EVIDENCE_FILE: ${{ runner.temp }}\release24-product-evidence\release24-host-stable.json
        run: npm run release24:extension-host -- --version=stable

      - name: Upload Release 2.3 Adapter SDK Preview (R24)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release24-product-evidence
          path: ${{ runner.temp }}/release24-product-evidence
          if-no-files-found: error

      - name: Validate measured v2 scenario evidence
        shell: pwsh
        run: ./scripts/validate-v2-scenario-catalog.ps1 -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence')

      - name: Prove all v2 evidence adversarial controls fail closed
        shell: pwsh
        run: node ./scripts/test-v2-execution-evidence-gate.mjs "--evidence-dir=$(Join-Path $env:RUNNER_TEMP 'v2-scenario-evidence')"

      - name: Upload measured v2 scenario evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-scenario-evidence
          path: ${{ runner.temp }}/v2-scenario-evidence
          if-no-files-found: error

      - name: Package VSIX (Windows x64)
        # `vsce package` runs the `vscode:prepublish` script, which builds, bundles the engine
        # into extension/engine/, and copies the LICENSE — so the artifact is self-contained.
        # The x64 chain up to the installed upgrade acceptance runs even after a failed suite above, for the same reason.
        id: package-x64
        if: ${{ !cancelled() && steps.build-extension.outcome == 'success' }}
        working-directory: extension
        env:
          WFD_BUNDLE_RID: win-x64
        run: npx --yes @vscode/vsce@3.9.2 package --target win32-x64 --no-dependencies -o winforms-designer-win32-x64.vsix

      - name: Assert VSIX contains the bundled engines (Windows x64)
        id: assert-x64
        if: ${{ !cancelled() && steps.package-x64.outcome == 'success' }}
        working-directory: extension
        shell: pwsh
        run: ../scripts/assert-vsix.ps1 -VsixPath winforms-designer-win32-x64.vsix -ExpectedTarget win32-x64 -ExpectedRuntimeIdentifier win-x64 -ExpectedModernMachine 0x8664 -ExpectedNet48Machine 0x8664

      - name: Freeze verified VSIX (Windows x64)
        id: freeze-x64
        if: ${{ !cancelled() && steps.assert-x64.outcome == 'success' }}
        working-directory: extension
        shell: pwsh
        run: Copy-Item -LiteralPath winforms-designer-win32-x64.vsix -Destination (Join-Path $env:RUNNER_TEMP 'frozen-win32-x64.vsix') -Force
      - name: Release 2.2 installed upgrade and downgrade (VS Code 1.84 and Stable)
        # Installs the frozen x64 package over a reconstructed 2.1.0 baseline in isolated profiles, prepares the rollback
        # with the product coordinator and downgrades, on the VS Code builds the product acceptance steps cached above.
        if: ${{ !cancelled() && steps.freeze-x64.outcome == 'success' }}
        working-directory: extension
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'release22-upgrade-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $vsix = Join-Path $env:RUNNER_TEMP 'frozen-win32-x64.vsix'
          $stable = Get-ChildItem .vscode-test -Directory -Filter 'vscode-win32-x64-archive-*' |
            ForEach-Object { $_.Name -replace '^vscode-win32-x64-archive-', '' } |
            Where-Object { $_ -ne '1.84.0' } | Sort-Object { [version]$_ } | Select-Object -Last 1
          if (-not $stable) { throw 'No cached VS Code Stable build for the installed upgrade acceptance.' }
          foreach ($version in @('1.84.0', $stable)) {
            npm run release22:upgrade -- "--version=$version" --baseline=18a01c096502039ea913a1e8cc2ad0d320837e35 "--new-vsix=$vsix" "--report=$(Join-Path $evidence "release22-upgrade-$version.json")"
            if ($LASTEXITCODE -ne 0) { throw "Installed upgrade/downgrade acceptance failed on VS Code $version" }
          }

      - name: Upload Release 2.2 installed upgrade evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release22-upgrade-evidence
          path: ${{ runner.temp }}/release22-upgrade-evidence
          if-no-files-found: warn

      - name: Package VSIX (Windows ARM64)
        working-directory: extension
        shell: pwsh
        env:
          WFD_BUNDLE_RID: win-arm64
        run: npx --yes @vscode/vsce@3.9.2 package --target win32-arm64 --no-dependencies -o winforms-designer-win32-arm64.vsix

      - name: Assert VSIX contains the bundled engines (Windows ARM64)
        working-directory: extension
        shell: pwsh
        run: ../scripts/assert-vsix.ps1 -VsixPath winforms-designer-win32-arm64.vsix -ExpectedTarget win32-arm64 -ExpectedRuntimeIdentifier win-arm64 -ExpectedModernMachine 0xAA64 -ExpectedNet48Machine 0x8664

      - name: Freeze and re-verify both VSIX artifacts
        working-directory: extension
        shell: pwsh
        run: |
          Copy-Item -LiteralPath winforms-designer-win32-arm64.vsix -Destination (Join-Path $env:RUNNER_TEMP 'frozen-win32-arm64.vsix') -Force
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'frozen-win32-x64.vsix') -Destination winforms-designer-win32-x64.vsix -Force
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'frozen-win32-arm64.vsix') -Destination winforms-designer-win32-arm64.vsix -Force
          ../scripts/assert-vsix.ps1 -VsixPath winforms-designer-win32-x64.vsix -ExpectedTarget win32-x64 -ExpectedRuntimeIdentifier win-x64 -ExpectedModernMachine 0x8664 -ExpectedNet48Machine 0x8664
          ../scripts/assert-vsix.ps1 -VsixPath winforms-designer-win32-arm64.vsix -ExpectedTarget win32-arm64 -ExpectedRuntimeIdentifier win-arm64 -ExpectedModernMachine 0xAA64 -ExpectedNet48Machine 0x8664

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: winforms-designer-vsix
          path: |
            extension/winforms-designer-win32-x64.vsix
            extension/winforms-designer-win32-arm64.vsix
          if-no-files-found: error
